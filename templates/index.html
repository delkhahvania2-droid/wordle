<!DOCTYPE html>
<html>
<head>
    <title>Wordle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121213;
            color: white;
            margin-top: 40px;
        }

        input {
            padding: 10px;
            font-size: 20px;
            width: 120px;
            text-transform: uppercase;
            text-align: center;
        }

        button {
            padding: 10px 18px;
            font-size: 18px;
            margin-left: 8px;
        }

        .row {
            margin: 10px;
        }

        .tile {
            width: 55px;
            height: 55px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            margin: 3px;
            border-radius: 5px;
        }

        .green { background: #538d4e; }
        .yellow { background: #b59f3b; }
        .gray { background: #3a3a3c; }

        a {
            color: #8ab4f8;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1>WORDLE</h1>

{% if attempts < 6 and message != "CORRECT!" %}
<form method="POST">
    <input name="guess" maxlength="5" required>
    <button type="submit">Guess</button>
</form>
{% endif %}

<h3>{{ message }}</h3>

{% for row in history %}
    <div class="row">
        {% for color, letter in row %}
            <div class="tile {{ color }}">{{ letter }}</div>
        {% endfor %}
    </div>
{% endfor %}

<br>
<a href="/reset">New Game</a>

</body>
</html>
